name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Lint, Test & Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: club_portal_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Security Audit Check
        run: |
          cd backend
          npm audit --audit-level=critical

      - name: Run Prisma Migrate Deploy & Seed
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/club_portal_db?schema=public
        run: |
          cd backend
          npx prisma migrate deploy
          node prisma/seed.js

      - name: Run Backend Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/club_portal_db?schema=public
          JWT_SECRET: super-secret-jwt-key-for-university-club-portal-2026
        run: |
          cd backend
          npm test

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend bundle
        run: |
          cd frontend
          npm run build
