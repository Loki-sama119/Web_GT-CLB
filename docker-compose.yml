services:
  postgres:
    image: postgres:16-alpine
    container_name: club_portal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: club_portal_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d club_portal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: club_portal_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/club_portal_db?schema=public
      JWT_SECRET: super-secret-jwt-key-for-university-club-portal-2026
      CORS_ORIGIN: http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:5173
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend_e2e:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: club_portal_backend_e2e
    restart: unless-stopped
    environment:
      NODE_ENV: test
      PORT: 5001
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/club_portal_e2e?schema=public
      JWT_SECRET: super-secret-jwt-key-for-university-club-portal-2026-e2e
      CORS_ORIGIN: http://localhost,http://localhost:80,http://localhost:5173,http://localhost:8080,http://127.0.0.1,http://127.0.0.1:8080
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: club_portal_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: club_portal_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      backend_e2e:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  pgdata:
  uploads_data:
