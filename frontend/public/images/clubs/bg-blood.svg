<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="blood-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0205"/>
      <stop offset="50%" stop-color="#4C0519"/>
      <stop offset="100%" stop-color="#110003"/>
    </linearGradient>
    <linearGradient id="red-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="b-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#blood-grad)"/>

  <!-- Concentric Blood Drop Ripple Rings -->
  <g fill="none" stroke="#E11D48" stroke-width="1.5" opacity="0.25">
    <circle cx="600" cy="337" r="100"/>
    <circle cx="600" cy="337" r="180" stroke-dasharray="6 6"/>
    <circle cx="600" cy="337" r="280"/>
    <circle cx="600" cy="337" r="400" stroke-dasharray="10 10"/>
  </g>

  <!-- Big Glowing Crimson Core Aura -->
  <circle cx="600" cy="337" r="180" fill="#E11D48" opacity="0.12" filter="url(#b-glow)"/>

  <!-- High-Energy Neon EKG Heartbeat Waveform -->
  <path d="M 0 337 L 250 337 L 290 337 L 320 220 L 360 450 L 400 150 L 440 400 L 470 310 L 510 337 L 700 337 L 740 337 L 770 200 L 810 460 L 850 140 L 890 410 L 920 320 L 960 337 L 1200 337"
        fill="none" stroke="#FF1744" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#b-glow)"/>
  <path d="M 0 337 L 250 337 L 290 337 L 320 220 L 360 450 L 400 150 L 440 400 L 470 310 L 510 337 L 700 337 L 740 337 L 770 200 L 810 460 L 850 140 L 890 410 L 920 320 L 960 337 L 1200 337"
        fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.9"/>

  <!-- Stylized Blood Drop Heart Silhouettes -->
  <g fill="#E11D48" opacity="0.2">
    <path d="M 180 180 C 180 140 210 110 240 140 C 270 110 300 140 300 180 C 300 230 240 270 240 270 C 240 270 180 230 180 180 Z"/>
    <path d="M 940 440 C 940 410 965 390 990 410 C 1015 390 1040 410 1040 440 C 1040 480 990 510 990 510 C 990 510 940 480 940 440 Z"/>
  </g>

  <!-- Watermark -->
  <text x="80" y="580" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="#FF1744" opacity="0.06">RED DROP</text>
</svg>
