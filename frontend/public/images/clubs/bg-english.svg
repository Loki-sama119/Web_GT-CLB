<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="eng-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051026"/>
      <stop offset="50%" stop-color="#0E2856"/>
      <stop offset="100%" stop-color="#030B1A"/>
    </linearGradient>
    <linearGradient id="globe-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="e-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#eng-grad)"/>

  <!-- Digital Global Meridian Rings & Longitude Curves -->
  <g fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.35">
    <ellipse cx="600" cy="337" rx="360" ry="240"/>
    <ellipse cx="600" cy="337" rx="240" ry="240" stroke-dasharray="8 6"/>
    <ellipse cx="600" cy="337" rx="120" ry="240"/>
    <line x1="200" y1="337" x2="1000" y2="337"/>
    <line x1="240" y1="217" x2="960" y2="217" stroke-dasharray="6 6"/>
    <line x1="240" y1="457" x2="960" y2="457" stroke-dasharray="6 6"/>
  </g>

  <!-- Worldwide Connection Arcs -->
  <g fill="none" stroke="url(#globe-blue)" filter="url(#e-glow)">
    <path d="M 320 280 Q 550 80 880 240" stroke-width="3" opacity="0.8"/>
    <path d="M 280 420 Q 600 580 920 380" stroke-width="3" opacity="0.7"/>
    <path d="M 360 220 Q 650 150 840 450" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Glowing Hub Nodes -->
  <g fill="#38BDF8" opacity="0.9">
    <circle cx="320" cy="280" r="5" filter="url(#e-glow)"/>
    <circle cx="880" cy="240" r="6" filter="url(#e-glow)"/>
    <circle cx="280" cy="420" r="4"/>
    <circle cx="920" cy="380" r="5"/>
    <circle cx="600" cy="337" r="7" filter="url(#e-glow)"/>
  </g>

  <!-- Ambient Light -->
  <circle cx="600" cy="337" r="260" fill="#38BDF8" opacity="0.1" filter="url(#e-glow)"/>

  <!-- Watermark -->
  <text x="80" y="580" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="#38BDF8" opacity="0.06">GLOBAL BEC</text>
</svg>
