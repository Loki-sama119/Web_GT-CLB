<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ma-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140202"/>
      <stop offset="50%" stop-color="#2D0808"/>
      <stop offset="100%" stop-color="#0A0101"/>
    </linearGradient>
    <linearGradient id="crimson-slash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="ma-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#ma-grad)"/>

  <!-- High-Impact Martial Arts Power Slashes -->
  <g stroke="url(#crimson-slash)" stroke-linecap="round" filter="url(#ma-glow)">
    <line x1="120" y1="580" x2="880" y2="80" stroke-width="8" opacity="0.8"/>
    <line x1="250" y1="640" x2="1020" y2="150" stroke-width="4" opacity="0.5"/>
    <line x1="40" y1="520" x2="720" y2="70" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Opposite Counter Impact Slash -->
  <line x1="950" y1="580" x2="450" y2="120" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6" filter="url(#ma-glow)"/>

  <!-- Dynamic Circular Shockwaves -->
  <circle cx="600" cy="337" r="150" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="12 8" opacity="0.4"/>
  <circle cx="600" cy="337" r="260" fill="none" stroke="#DC2626" stroke-width="1.5" opacity="0.25"/>

  <!-- Ambient Glow -->
  <circle cx="600" cy="337" r="220" fill="#EF4444" opacity="0.1" filter="url(#ma-glow)"/>

  <!-- Watermark -->
  <text x="80" y="580" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="#EF4444" opacity="0.06">TAEKWONDO</text>
</svg>
