<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="start-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120E05"/>
      <stop offset="50%" stop-color="#2D1F08"/>
      <stop offset="100%" stop-color="#0A0702"/>
    </linearGradient>
    <linearGradient id="gold-surge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <filter id="s-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#start-grad)"/>

  <!-- Polygonal Breakthrough Shards -->
  <g fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.3">
    <polygon points="400,600 550,450 700,550"/>
    <polygon points="550,450 750,300 850,480"/>
    <polygon points="750,300 950,150 1050,350"/>
    <polygon points="200,500 350,380 450,520"/>
  </g>

  <!-- Glowing Ascending Laser Momentum Trails -->
  <g stroke="url(#gold-surge)" stroke-linecap="round" filter="url(#s-glow)">
    <line x1="250" y1="620" x2="880" y2="120" stroke-width="6" opacity="0.8"/>
    <line x1="400" y1="650" x2="1050" y2="140" stroke-width="3" opacity="0.5"/>
    <line x1="120" y1="580" x2="680" y2="160" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Ascending Spark Nodes -->
  <g fill="#FDE047" opacity="0.9">
    <circle cx="880" cy="120" r="8" filter="url(#s-glow)"/>
    <circle cx="750" cy="300" r="5"/>
    <circle cx="550" cy="450" r="4"/>
    <circle cx="1050" cy="140" r="6" filter="url(#s-glow)"/>
  </g>

  <!-- Golden Ambient Glow -->
  <circle cx="880" cy="120" r="240" fill="#F59E0B" opacity="0.12" filter="url(#s-glow)"/>

  <!-- Watermark -->
  <text x="80" y="580" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="#F59E0B" opacity="0.06">INNOVATE</text>
</svg>
