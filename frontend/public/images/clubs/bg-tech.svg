<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#020C1B"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cyber-grid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0FF" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg-grad)"/>

  <!-- Perspective Cyber Grid Ground -->
  <rect y="250" width="1200" height="425" fill="url(#grid)" opacity="0.7"/>
  <rect y="250" width="1200" height="425" fill="url(#cyber-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="280" fill="#00F0FF" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="320" fill="#3B82F6" opacity="0.1" filter="url(#glow)"/>

  <!-- Circuit Lines & Microchip Traces -->
  <g stroke="#00F0FF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.45" filter="url(#glow)">
    <path d="M 50 150 L 250 150 L 350 250 L 600 250 L 650 300 L 900 300"/>
    <path d="M 150 500 L 300 500 L 400 400 L 750 400 L 850 500 L 1150 500"/>
    <path d="M 700 80 L 820 80 L 920 180 L 1100 180"/>
    <path d="M 100 320 L 220 320 L 280 380 L 480 380"/>
  </g>

  <!-- Circuit Nodes -->
  <g fill="#00F0FF" opacity="0.8">
    <circle cx="250" cy="150" r="4"/>
    <circle cx="350" cy="250" r="5"/>
    <circle cx="650" cy="300" r="4"/>
    <circle cx="900" cy="300" r="6" filter="url(#glow)"/>
    <circle cx="400" cy="400" r="5"/>
    <circle cx="750" cy="400" r="4"/>
    <circle cx="820" cy="80" r="4"/>
    <circle cx="920" cy="180" r="5"/>
  </g>

  <!-- Dynamic Diagonal Code Streaks -->
  <g stroke="url(#cyan-glow)" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="100" y1="60" x2="380" y2="60"/>
    <line x1="850" y1="620" x2="1120" y2="620"/>
    <line x1="40" y1="620" x2="220" y2="620" stroke-width="1.5"/>
  </g>

  <!-- Hexagonal Tech Cluster -->
  <g stroke="#00F0FF" stroke-width="1.5" fill="none" opacity="0.25">
    <polygon points="1050,150 1100,121 1150,150 1150,208 1100,237 1050,208"/>
    <polygon points="1100,237 1150,208 1200,237 1200,295 1150,324 1100,295"/>
    <polygon points="1000,237 1050,208 1100,237 1100,295 1050,324 1000,295"/>
    <polygon points="1050,324 1100,295 1150,324 1150,382 1100,411 1050,382"/>
  </g>

  <!-- High-Tech Neon Code Emblem Watermark -->
  <g opacity="0.08" fill="#00F0FF" font-family="monospace" font-weight="900">
    <text x="80" y="380" font-size="140">&lt;DEV/&gt;</text>
    <text x="680" y="580" font-size="120">01001001</text>
  </g>

  <!-- High Energy Glow Accents -->
  <path d="M 0 0 L 400 0 L 250 675 L 0 675 Z" fill="#00F0FF" opacity="0.03"/>
  <path d="M 1200 0 L 950 0 L 800 675 L 1200 675 Z" fill="#3B82F6" opacity="0.04"/>
</svg>
