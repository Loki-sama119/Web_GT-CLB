<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="vol-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021E14"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#02140D"/>
    </linearGradient>
    <linearGradient id="leaf-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="v-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#vol-grad)"/>

  <!-- Radiant Sunburst Energy Rays -->
  <g fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.15">
    <line x1="600" y1="337" x2="0" y2="0"/>
    <line x1="600" y1="337" x2="200" y2="0"/>
    <line x1="600" y1="337" x2="400" y2="0"/>
    <line x1="600" y1="337" x2="800" y2="0"/>
    <line x1="600" y1="337" x2="1000" y2="0"/>
    <line x1="600" y1="337" x2="1200" y2="0"/>
    <line x1="600" y1="337" x2="1200" y2="250"/>
    <line x1="600" y1="337" x2="1200" y2="450"/>
    <line x1="600" y1="337" x2="1200" y2="675"/>
    <line x1="600" y1="337" x2="800" y2="675"/>
    <line x1="600" y1="337" x2="400" y2="675"/>
    <line x1="600" y1="337" x2="0" y2="675"/>
    <line x1="600" y1="337" x2="0" y2="400"/>
    <line x1="600" y1="337" x2="0" y2="200"/>
  </g>

  <!-- Glowing Volunteer Heart / Hands Aura Waves -->
  <circle cx="600" cy="337" r="220" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="12 8" opacity="0.3"/>
  <circle cx="600" cy="337" r="140" fill="#10B981" opacity="0.12" filter="url(#v-glow)"/>

  <!-- Flowing Leaf Shapes in Wind -->
  <g fill="url(#leaf-glow)" opacity="0.25">
    <path d="M 220 200 C 260 160 320 180 340 230 C 300 270 240 250 220 200 Z"/>
    <path d="M 850 420 C 900 370 980 390 1010 450 C 960 500 880 480 850 420 Z"/>
    <path d="M 950 140 C 980 110 1030 120 1050 160 C 1020 190 970 180 950 140 Z"/>
    <path d="M 140 460 C 180 420 230 435 250 480 C 210 520 160 500 140 460 Z"/>
  </g>

  <!-- Dynamic Swirl Energy -->
  <path d="M 0 550 Q 300 480 600 520 T 1200 450" fill="none" stroke="#34D399" stroke-width="4" opacity="0.4" filter="url(#v-glow)"/>
  <path d="M 0 580 Q 350 510 650 550 T 1200 490" fill="none" stroke="#10B981" stroke-width="2" opacity="0.3"/>

  <!-- Watermark -->
  <text x="120" y="580" font-family="Arial, sans-serif" font-weight="900" font-size="140" fill="#34D399" opacity="0.06">GREEN YOUTH</text>
</svg>
